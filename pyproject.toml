[project]
name = "roborsi"
version = "0.1.0"
description = "A multi-agent harness for self-evolving robot skills"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "roborsi contributors"}
]
keywords = ["robotics", "embodied-ai", "multi-agent", "skill-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "litellm>=1.82.1,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.3,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "dingtalk-stream>=0.24.0,<1.0.0",
    "python-telegram-bot[socks]>=22.6,<23.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "socksio>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "lerobot[feetech,dynamixel,pi]",
    "pyserial>=3.5,<4.0",
    "flexivrdk>=1.8.1",
    "record3d>=1.4.0",
]

[project.optional-dependencies]
wecom = [
    "wecom-aibot-sdk-python>=0.1.5",
]
matrix = [
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]
brainco = [
    "bc-stark-sdk>=1.2.4",
]
langsmith = [
    "langsmith>=0.1.0",
]
web = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]
libero = [
    "bddl==1.0.1",
    "cloudpickle>=2.1,<4.0",
    "easydict>=1.9,<2.0",
    "future>=0.18.2",
    "gym==0.25.2",
    "h5py>=3.8,<4.0",
    "imageio>=2.36,<3.0",
    "imageio-ffmpeg>=0.5,<1.0",
    "matplotlib>=3.5,<4.0",
    "mujoco==3.3.0",
    "numpy>=2.0,<2.3",
    "opencv-python>=4.10,<5.0",
    "pyyaml>=6.0,<7.0",
    "robosuite==1.4.0",
    "scipy>=1.11,<2.0",
    "termcolor>=2.4,<4.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pexpect>=4.9.0,<5.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
roborsi = "roborsi.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
lerobot = { path = "roborsi/embodied/engine", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "roborsi/**/*.py",
    "roborsi/frontend/tui/**/*",
    "roborsi/templates/**/*.md",
    "roborsi/skills/**/*.md",
    "roborsi/skills/**/*.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["roborsi"]

[tool.hatch.build.targets.wheel.sources]
"roborsi" = "roborsi"

[tool.hatch.build.targets.wheel.force-include]
"bridge" = "roborsi/bridge"

[tool.hatch.build.targets.sdist]
include = [
    "roborsi/",
    "bridge/",
    "frontend/web/",
    "scripts/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hardware: tests that require physical hardware (skip with: pytest -m 'not hardware')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.16.0",
]
