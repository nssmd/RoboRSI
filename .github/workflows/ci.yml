name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -m "not runtime"
      - if: matrix.python-version == '3.11'
        run: ruff check src/roborsi_libero tests scripts
      - if: matrix.python-version == '3.11'
        run: python scripts/release_check.py
      - if: matrix.python-version == '3.11'
        run: ./reproduce.sh --skip-setup --output-dir /tmp/roborsi-reproduction
      - if: matrix.python-version == '3.11'
        run: python -m build

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[runtime,dev]"
      - run: pytest -q
      - run: python scripts/check_libero_gt_leak.py
